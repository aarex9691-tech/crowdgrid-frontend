name: Frontend build

on:
  push:
    branches: [main, notes-round2]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (warnings allowed, errors fail)
        run: npm run lint
      - name: Production build
        run: npm run build

  e2e:
    # The 39 manual cases from the handover doc, in a real browser (e2e/README.md).
    # Runs only when this repository has TEST_MONGO_URI (a database ending in _test) and
    # SEED_PASSWORD secrets. Atlas must allow access from anywhere (0.0.0.0/0) for that cluster.
    name: Manual cases in the browser (test database)
    runs-on: ubuntu-latest
    needs: build
    concurrency: crowdgrid-test-database # one run at a time: the tests re-seed the test database
    env:
      TEST_MONGO_URI: ${{ secrets.TEST_MONGO_URI }}
      SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      QR_SECRET: ci-only-qr-secret-not-used-anywhere-else
      CROWDGRID_BACKEND_DIR: ${{ github.workspace }}/backend
    steps:
      - name: No test database configured
        if: env.TEST_MONGO_URI == ''
        run: echo "Add TEST_MONGO_URI (database ending in _test) and SEED_PASSWORD secrets to run the browser tests here."
      - uses: actions/checkout@v4
        if: env.TEST_MONGO_URI != ''
      - uses: actions/checkout@v4
        if: env.TEST_MONGO_URI != ''
        with:
          repository: aarex9691-tech/crowdgrid-backend
          path: backend
      - uses: actions/setup-node@v4
        if: env.TEST_MONGO_URI != ''
        with:
          node-version: 22
      - name: Install frontend, backend and test tools
        if: env.TEST_MONGO_URI != ''
        run: |
          npm ci
          npm ci --prefix backend
          npm install --prefix e2e
          cd e2e && npx playwright install --with-deps chromium
      - name: Run the manual cases
        if: env.TEST_MONGO_URI != ''
        working-directory: e2e
        run: npx playwright test
      - name: Keep the report
        if: always() && env.TEST_MONGO_URI != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/results
            e2e/.state/backend.log
          retention-days: 14
